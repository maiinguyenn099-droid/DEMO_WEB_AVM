<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Học Sinh</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

    <!-- Header -->
    <div style="background-color: #1e3a8a; color: white; padding: 15px; text-align: center;">
        <h1 style="margin: 0;">📚 CỬA HÀNG HỌC SINH</h1>
        <p style="margin: 5px 0 0 0;">Đồ dùng học tập giá rẻ</p>
    </div>

    <div style="padding: 10px; text-align: center; background-color: #e0e0e0;">
        <a href="#" style="margin: 0 15px; text-decoration: none; color: #1e3a8a;">Trang chủ</a>
        <a href="#sanpham" style="margin: 0 15px; text-decoration: none; color: #1e3a8a;">Sản phẩm</a>
        <a href="#" onclick="showCart()" style="margin: 0 15px; text-decoration: none; color: #1e3a8a;">
            🛒 Giỏ hàng (<span id="cart-count">0</span>)
        </a>
    </div>

    <!-- Banner -->
    <div style="background-color: #4e73df; color: white; padding: 40px 20px; text-align: center;">
        <h2>Chào mừng các bạn học sinh!</h2>
        <p style="font-size: 18px;">Mua đồ dùng học tập - Giá sinh viên</p>
        <button onclick="document.getElementById('sanpham').scrollIntoView()" 
                style="padding: 12px 25px; font-size: 18px; background-color: #ff4757; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Xem sản phẩm
        </button>
    </div>

    <!-- Danh sách sản phẩm -->
    <div id="sanpham" style="padding: 20px;">
        <h2 style="text-align: center; color: #1e3a8a;">Sản phẩm nổi bật</h2>
        <br>

        <div id="product-list" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
            <!-- Sản phẩm sẽ được JavaScript tạo ra -->
        </div>
    </div>

    <!-- Giỏ hàng -->
    <div id="cart-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 999;">
        <div style="background-color: white; margin: 50px auto; width: 90%; max-width: 600px; padding: 20px; border-radius: 10px;">
            <h2>Giỏ hàng của bạn</h2>
            <div id="cart-items" style="min-height: 200px;"></div>
            <h3 style="text-align: right;">Tổng tiền: <span id="total-price">0đ</span></h3>
            
            <button onclick="checkout()" 
                    style="width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; margin: 10px 0; font-size: 18px; cursor: pointer;">
                Thanh toán
            </button>
            <button onclick="closeCart()" 
                    style="width: 100%; padding: 12px; background-color: #95a5a6; color: white; border: none; cursor: pointer;">
                Đóng
            </button>
        </div>
    </div>

    <footer style="background-color: #2c3e50; color: white; text-align: center; padding: 20px; margin-top: 30px;">
        <p><strong>Shop Học Sinh</strong></p>
        <p>Website demo thuần HTML để dạy học sinh phổ thông</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Bút bi Thiên Long", price: 15000, description: "Viết êm, bền" },
            { id: 2, name: "Tập học sinh 200 trang", price: 25000, description: "Giấy trắng mịn" },
            { id: 3, name: "Cặp sách chống nước", price: 320000, description: "Nhiều ngăn" },
            { id: 4, name: "Thước kẻ 30cm", price: 12000, description: "Nhựa trong" },
            { id: 5, name: "Bộ compa", price: 45000, description: "Đầy đủ phụ kiện" },
            { id: 6, name: "Máy tính Casio", price: 450000, description: "Máy tính khoa học" }
        ];

        let cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';

            products.forEach(product => {
                const div = document.createElement('div');
                div.style = `
                    border: 2px solid #ddd; 
                    border-radius: 10px; 
                    width: 280px; 
                    padding: 15px; 
                    text-align: center;
                    background-color: white;
                `;
                div.innerHTML = `
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <p style="color: red; font-size: 18px; font-weight: bold;">
                        ${product.price.toLocaleString('vi-VN')}đ
                    </p>
                    <button onclick="addToCart(${product.id})" 
                            style="padding: 10px 20px; background-color: #1e3a8a; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Thêm vào giỏ
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            
            if (exist) {
                exist.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            
            updateCartCount();
            
            alert(`✅ Đã thêm "${product.name}" vào giỏ hàng!`);
        }

        function updateCartCount() {
            let count = 0;
            cart.forEach(item => count += item.quantity);
            document.getElementById('cart-count').textContent = count;
        }

        function showCart() {
            const modal = document.getElementById('cart-modal');
            const itemsDiv = document.getElementById('cart-items');
            let total = 0;
            itemsDiv.innerHTML = '';

            if (cart.length === 0) {
                itemsDiv.innerHTML = '<p style="text-align:center; padding:30px;">Giỏ hàng trống</p>';
            } else {
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    itemsDiv.innerHTML += `
                        <div style="border-bottom: 1px solid #ddd; padding: 10px 0;">
                            <strong>${item.name}</strong> x ${item.quantity}<br>
                            <small>${item.price.toLocaleString('vi-VN')}đ</small><br>
                            <button onclick="changeQuantity(${index}, -1)" style="margin:5px;">-</button>
                            <button onclick="changeQuantity(${index}, 1)" style="margin:5px;">+</button>
                            <button onclick="removeFromCart(${index})" style="color:red;">Xóa</button>
                        </div>
                    `;
                });
            }

            document.getElementById('total-price').textContent = total.toLocaleString('vi-VN') + 'đ';
            modal.style.display = 'block';
        }

        function changeQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity < 1) cart.splice(index, 1);
            showCart();
            updateCartCount();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            showCart();
            updateCartCount();
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function checkout() {
            if (cart.length === 0) return;
            alert('🎉 Cảm ơn bạn đã mua hàng! (Đây là website demo)');
            cart = [];
            updateCartCount();
            closeCart();
        }

        // Khởi chạy
        window.onload = function() {
            renderProducts();
        };
    </script>

</body>
</html>
